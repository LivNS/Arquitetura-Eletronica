<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="640" fill="#ffffff"/>

  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#111">Diagrama de alimentação — carrinho-robô (ESP32)</text>
  <text x="450" y="58" text-anchor="middle" font-size="13" fill="#666">Fonte única, dois barramentos: potência (motores) e lógica (5 V / 3,3 V)</text>

  <rect x="330" y="84" width="240" height="72" rx="8" fill="#fdeef2" stroke="#c2185b" stroke-width="2.5"/>
  <text x="450" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Bateria</text>
  <text x="450" y="132" text-anchor="middle" font-size="13" fill="#333">2 × Li-ion 18650 em série</text>
  <text x="450" y="149" text-anchor="middle" font-size="12" fill="#666">7,4 V nominal (8,4 V carregada)</text>

  <line x1="450" y1="156" x2="450" y2="194" stroke="#c62828" stroke-width="3" marker-end="url(#s)"/>
  <text x="462" y="180" font-size="12" fill="#c62828">V+ (7,4 V)</text>

  <rect x="620" y="172" width="200" height="44" rx="6" fill="#f5f5f5" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="720" y="192" text-anchor="middle" font-size="12" fill="#666">Alternativa do slide 7:</text>
  <text x="720" y="208" text-anchor="middle" font-size="11" fill="#666">power bank USB só para o ESP32</text>

  <rect x="340" y="196" width="220" height="58" rx="8" fill="#fff8e1" stroke="#b58100" stroke-width="2"/>
  <text x="450" y="220" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Chave geral ON/OFF</text>
  <text x="450" y="241" text-anchor="middle" font-size="12" fill="#555">corta o positivo da bateria</text>

  <line x1="450" y1="254" x2="450" y2="290" stroke="#c62828" stroke-width="3"/>
  <line x1="230" y1="290" x2="670" y2="290" stroke="#c62828" stroke-width="3"/>
  <line x1="230" y1="290" x2="230" y2="328" stroke="#c62828" stroke-width="3" marker-end="url(#s)"/>
  <line x1="670" y1="290" x2="670" y2="328" stroke="#c62828" stroke-width="3" marker-end="url(#s)"/>

  <rect x="110" y="330" width="240" height="72" rx="8" fill="#eef7ee" stroke="#2e7d32" stroke-width="2"/>
  <text x="230" y="356" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">Ponte H L298N</text>
  <text x="230" y="376" text-anchor="middle" font-size="12" fill="#333">entrada +12 V (VMS) ← 7,4 V</text>
  <text x="230" y="393" text-anchor="middle" font-size="11" fill="#666">queda interna ~2 V → ~5,4 V nos motores</text>

  <line x1="230" y1="402" x2="230" y2="444" stroke="#333" stroke-width="2" marker-end="url(#s)"/>
  <rect x="110" y="446" width="240" height="60" rx="8" fill="#fff8e1" stroke="#b58100" stroke-width="2"/>
  <text x="230" y="470" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">2 × Motor DC</text>
  <text x="230" y="491" text-anchor="middle" font-size="12" fill="#333">3–6 V · pico ~1,2 A cada</text>

  <rect x="550" y="330" width="240" height="72" rx="8" fill="#e8f1fb" stroke="#2d6cb5" stroke-width="2"/>
  <text x="670" y="356" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">Regulador 5 V</text>
  <text x="670" y="376" text-anchor="middle" font-size="12" fill="#333">step-down MP1584 / LM2596</text>
  <text x="670" y="393" text-anchor="middle" font-size="11" fill="#666">≥ 1 A · ajustar em 5,0 V antes de ligar</text>

  <line x1="670" y1="402" x2="670" y2="444" stroke="#333" stroke-width="2" marker-end="url(#s)"/>
  <rect x="550" y="446" width="240" height="60" rx="8" fill="#e8f1fb" stroke="#2d6cb5" stroke-width="2"/>
  <text x="670" y="468" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">ESP32 (pino VIN / 5 V)</text>
  <text x="670" y="489" text-anchor="middle" font-size="12" fill="#333">regulador interno → 3,3 V · HC-SR04 no 5 V</text>

  <line x1="110" y1="544" x2="790" y2="544" stroke="#111" stroke-width="4"/>
  <text x="450" y="570" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">GND COMUM — bateria, L298N, regulador, ESP32 e sensor no mesmo terra</text>
  <line x1="230" y1="506" x2="230" y2="544" stroke="#111" stroke-width="2"/>
  <line x1="670" y1="506" x2="670" y2="544" stroke="#111" stroke-width="2"/>

  <text x="450" y="604" text-anchor="middle" font-size="12" fill="#c62828" font-weight="bold">Pico de corrente dos motores derruba a alimentação da lógica: o ESP32 reinicia sozinho se compartilhar o regulador do L298N.</text>
  <text x="450" y="624" text-anchor="middle" font-size="11" fill="#777">Se usar power bank no ESP32, o GND dele ainda precisa estar ligado ao GND do L298N.</text>

  <defs>
    <marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>
</svg>
