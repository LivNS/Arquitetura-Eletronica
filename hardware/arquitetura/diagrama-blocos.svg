<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="620" fill="#ffffff"/>

  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#111">Diagrama de blocos — carrinho-robô (ESP32 + Wi-Fi)</text>
  <text x="450" y="58" text-anchor="middle" font-size="13" fill="#666">Sinais de controle e dados · alimentação em diagrama-alimentacao.svg</text>

  <!-- HC-SR04 -->
  <rect x="330" y="88" width="240" height="62" rx="8" fill="#e8f1fb" stroke="#2d6cb5" stroke-width="2"/>
  <text x="450" y="115" text-anchor="middle" font-size="16" font-weight="bold" fill="#123">Sensor ultrassônico</text>
  <text x="450" y="136" text-anchor="middle" font-size="13" fill="#345">HC-SR04</text>

  <line x1="450" y1="150" x2="450" y2="224" stroke="#333" stroke-width="2" marker-end="url(#seta)"/>
  <text x="462" y="176" font-size="12" fill="#333">TRIG → GPIO 5</text>
  <text x="462" y="194" font-size="12" fill="#333">ECHO → GPIO 18 (divisor 1k/2k)</text>

  <!-- Celular -->
  <rect x="50" y="242" width="210" height="76" rx="8" fill="#e8f1fb" stroke="#2d6cb5" stroke-width="2"/>
  <text x="155" y="270" text-anchor="middle" font-size="16" font-weight="bold" fill="#123">Celular</text>
  <text x="155" y="290" text-anchor="middle" font-size="12" fill="#345">navegador → http://IP-do-ESP32</text>
  <text x="155" y="308" text-anchor="middle" font-size="11" fill="#777">botões FRENTE / RÉ / ← / → / PARAR</text>

  <line x1="260" y1="280" x2="330" y2="280" stroke="#2d6cb5" stroke-width="2" stroke-dasharray="6 5" marker-start="url(#seta-inv)" marker-end="url(#seta)"/>
  <text x="295" y="268" text-anchor="middle" font-size="12" fill="#2d6cb5" font-weight="bold">Wi-Fi</text>
  <text x="295" y="302" text-anchor="middle" font-size="11" fill="#777">HTTP porta 80</text>

  <!-- Controlador -->
  <rect x="330" y="226" width="240" height="110" rx="8" fill="#fdeef2" stroke="#c2185b" stroke-width="2.5"/>
  <text x="450" y="258" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">ESP32</text>
  <text x="450" y="280" text-anchor="middle" font-size="13" fill="#333">WebServer na porta 80</text>
  <text x="450" y="300" text-anchor="middle" font-size="11" fill="#777">rotas: /frente /tras /esquerda</text>
  <text x="450" y="316" text-anchor="middle" font-size="11" fill="#777">/direita /parar /velocidade /status</text>
  <text x="450" y="331" text-anchor="middle" font-size="11" fill="#999">firmware: /src/codigo.ino</text>

  <line x1="450" y1="336" x2="450" y2="412" stroke="#333" stroke-width="2" marker-end="url(#seta)"/>
  <text x="462" y="358" font-size="12" fill="#333">ENA→GPIO 14 (PWM)  IN1→27  IN2→26</text>
  <text x="462" y="376" font-size="12" fill="#333">ENB→GPIO 32 (PWM)  IN3→33  IN4→25</text>
  <text x="462" y="396" font-size="11" fill="#777">6 fios de controle</text>

  <!-- Ponte H -->
  <rect x="330" y="414" width="240" height="66" rx="8" fill="#eef7ee" stroke="#2e7d32" stroke-width="2"/>
  <text x="450" y="442" text-anchor="middle" font-size="16" font-weight="bold" fill="#123">Ponte H</text>
  <text x="450" y="462" text-anchor="middle" font-size="13" fill="#345">L298N (driver duplo)</text>

  <line x1="390" y1="480" x2="330" y2="530" stroke="#333" stroke-width="2" marker-end="url(#seta)"/>
  <line x1="510" y1="480" x2="570" y2="530" stroke="#333" stroke-width="2" marker-end="url(#seta)"/>
  <text x="296" y="506" font-size="12" fill="#333">OUT1/OUT2</text>
  <text x="546" y="506" font-size="12" fill="#333">OUT3/OUT4</text>

  <rect x="200" y="532" width="180" height="56" rx="8" fill="#fff8e1" stroke="#b58100" stroke-width="2"/>
  <text x="290" y="556" text-anchor="middle" font-size="15" font-weight="bold" fill="#123">Motor esquerdo</text>
  <text x="290" y="576" text-anchor="middle" font-size="12" fill="#345">Motor A — ENA/IN1/IN2</text>

  <rect x="520" y="532" width="180" height="56" rx="8" fill="#fff8e1" stroke="#b58100" stroke-width="2"/>
  <text x="610" y="556" text-anchor="middle" font-size="15" font-weight="bold" fill="#123">Motor direito</text>
  <text x="610" y="576" text-anchor="middle" font-size="12" fill="#345">Motor B — ENB/IN3/IN4</text>

  <!-- notas -->
  <text x="620" y="256" font-size="11" fill="#777">Alternativas prontas em /src/alternativas:</text>
  <text x="620" y="272" font-size="11" fill="#777">• ESP32 + BLE (Dabble)</text>
  <text x="620" y="288" font-size="11" fill="#777">• Arduino Uno + HC-05 (Dabble)</text>

  <text x="60" y="400" font-size="11" fill="#777">GND comum obrigatório</text>
  <text x="60" y="416" font-size="11" fill="#777">entre ESP32, L298N e sensor.</text>

  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
    <marker id="seta-inv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2d6cb5"/>
    </marker>
  </defs>
</svg>
